<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Push-Up Counter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;
  overflow:hidden;
  background:#020617;
  font-family:Inter,system-ui,-apple-system,sans-serif;
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}
#app{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 30%, #2563eb 0%, #0f172a 45%, #020617 100%);
  transition:.08s;
}
#app:active{
  transform:scale(.985);
  filter:brightness(1.15);
}
.glow{
  position:absolute;
  width:340px;height:340px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(96,165,250,.35),transparent 70%);
  filter:blur(20px);
}
.label{
  letter-spacing:.35em;
  color:#bfdbfe;
  font-size:13px;
  font-weight:700;
}
#count{
  font-size:132px;
  font-weight:800;
  line-height:1;
  margin:18px 0;
  font-variant-numeric:tabular-nums;
}
.hint{
  color:#cbd5e1;
  font-size:18px;
}
.footer{
  position:absolute;
  bottom:28px;
  color:#64748b;
  font-size:14px;
}
</style>
</head>
<body>
<div id="app">
  <div class="glow"></div>
  <div class="label">PUSH-UP COUNTER</div>
  <div id="count">0</div>
  <div class="hint">Touch anywhere with your nose</div>
  <div class="footer">Refresh = Reset</div>
</div>

<script>
let count=0, armed=true;
const app=document.getElementById('app');
const num=document.getElementById('count');

function update(){ num.textContent=count; }

app.onpointerdown=e=>{
  e.preventDefault();
  if(!armed) return;
  armed=false;
  count++;
  update();
  if(navigator.vibrate) navigator.vibrate(12);
};
window.onpointerup=()=>armed=true;
window.onpointercancel=()=>armed=true;
</script>
</body>
</html>
