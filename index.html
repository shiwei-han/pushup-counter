<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Push-Up Counter</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #020617;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

/* Entire screen is clickable */
#app {
  position: fixed;
  inset: 0;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at 50% 30%,
      #2563eb 0%,
      #0f172a 45%,
      #020617 100%
    );

  transition:
    transform 0.08s ease,
    filter 0.08s ease;
}

/* Subtle press effect */
#app:active {
  transform: scale(0.985);
  filter: brightness(1.15);
}

/* Background glow */
.glow {
  position: absolute;

  width: 340px;
  height: 340px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(96, 165, 250, 0.35),
      transparent 70%
    );

  filter: blur(20px);

  pointer-events: none;
}

/* Title */
.label {
  position: relative;

  letter-spacing: 0.35em;

  color: #bfdbfe;

  font-size: 13px;
  font-weight: 700;
}

/* Counter */
#count {
  position: relative;

  font-size: 132px;
  font-weight: 800;
  line-height: 1;

  margin: 18px 0;

  font-variant-numeric: tabular-nums;

  text-shadow:
    0 0 30px rgba(96, 165, 250, 0.25);
}

/* Bottom text */
.footer {
  position: absolute;

  bottom: 28px;

  color: #64748b;

  font-size: 14px;
}
</style>
</head>

<body>

<div id="app">

  <div class="glow"></div>

  <div class="label">
    PUSH-UP COUNTER
  </div>

  <div id="count">
    0
  </div>

  <div class="footer">
    Refresh = Reset
  </div>

</div>

<script>

let count = 0;
let armed = true;

const app = document.getElementById("app");
const counter = document.getElementById("count");

/* Update counter */
function updateCounter() {
  counter.textContent = count;
}

/* Count one push-up */
app.addEventListener("pointerdown", function(event) {

  event.preventDefault();

  /*
    Prevent multiple counts while
    the nose is still touching the screen.
  */
  if (!armed) {
    return;
  }

  armed = false;

  count++;

  updateCounter();

  /* Haptic feedback */
  if (navigator.vibrate) {
    navigator.vibrate(12);
  }
});

/*
  Arm the counter again when
  the nose leaves the screen.
*/
window.addEventListener("pointerup", function() {
  armed = true;
});

window.addEventListener("pointercancel", function() {
  armed = true;
});

</script>

</body>
</html>
